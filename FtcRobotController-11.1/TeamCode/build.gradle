//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    // Deploy/build stamp shown on Driver Station telemetry (BuildInfo.DEPLOYED).
    sourceSets.main.java.srcDirs += "$buildDir/generated/source/buildInfo/java"
}

// Stamp: DEPLOY_STAMP from ./deploy.sh, else local build time.
tasks.register('generateBuildInfo') {
    def outRoot = file("$buildDir/generated/source/buildInfo/java")
    def pkgDir = file("$outRoot/org/firstinspires/ftc/teamcode/Main")
    outputs.dir(outRoot)
    doLast {
        pkgDir.mkdirs()
        def stamp = System.getenv('DEPLOY_STAMP')
        if (stamp == null || stamp.trim().isEmpty()) {
            stamp = new Date().format('yyyy-MM-dd HH:mm:ss')
        }
        // Escape for a Java string literal
        def safe = stamp.replace('\\', '\\\\').replace('"', '\\"')
        new File(pkgDir, 'BuildInfo.java').text = """\
package org.firstinspires.ftc.teamcode.Main;

/** Generated by TeamCode/build.gradle — do not edit. */
public final class BuildInfo {
    public static final String DEPLOYED = "${safe}";
    private BuildInfo() {}
}
"""
        println "BuildInfo.DEPLOYED = ${stamp}"
    }
}
tasks.named('preBuild').configure { dependsOn('generateBuildInfo') }

dependencies {
    implementation project(':FtcRobotController')
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.7'
    implementation 'com.acmerobotics.roadrunner:core:0.5.6'
    // Shooter telemetry WebSocket server. RobotCore already ships NanoHTTPD, so
    // exclude the transitive core jar to avoid checkDebugDuplicateClasses.
    implementation('org.nanohttpd:nanohttpd-websocket:2.3.1') {
        exclude group: 'org.nanohttpd', module: 'nanohttpd'
    }
}
